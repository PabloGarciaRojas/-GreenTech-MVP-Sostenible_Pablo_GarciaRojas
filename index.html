<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Salvemos el Planeta - GreenTech</title>

    <style>
      /* CSS NATIVO: El uso de variables y Flexbox reemplaza a Bootstrap.
          Al ser un código tan ligero, evitamos el sobrecalentamiento en teléfonos 
          de gama baja, combatiendo la obsolescencia programada (CE 4.e).
        */
      :root {
        --primary-color: #28a745;
        --primary-hover: #1e7e34;
        --bg-color: #f4fdf4;
        --text-light: #ffffff;
        --text-dark: #212529;
      }
      body {
        font-family: "Montserrat", sans-serif;
        background-color: var(--bg-color);
        margin: 0;
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }
      .hero-gigante {
        position: relative;
        flex-grow: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        padding: 20px;
        color: var(--text-light);
        text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.8);
        overflow: hidden;
      }
      .hero-bg {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        z-index: -1;
      }
      /*la imagen es una etiqueta para poder poner el lazy loading*/
      h1 {
        font-size: clamp(2.5rem, 5vw, 4rem);
        font-weight: 700;
        margin: 0;
      }
      p {
        font-size: clamp(1.2rem, 2vw, 1.5rem);
        font-weight: 400;
        margin-top: 1rem;
      }
      .btn-eco {
        background-color: var(--primary-color);
        color: var(--text-light);
        border: 2px solid var(--primary-color);
        padding: 15px 40px;
        font-size: 1.5rem;
        font-family: "Montserrat", sans-serif;
        font-weight: 700;
        border-radius: 50px;
        box-shadow: 0 4px 15px rgba(40, 167, 69, 0.4);
        cursor: pointer;
        transition: all 0.3s ease;
        margin-top: 2rem;
        display: inline-flex;
        align-items: center;
        gap: 10px;
      }
      .btn-eco:hover {
        background-color: var(--primary-hover);
        border-color: var(--primary-hover);
        transform: translateY(-2px);
      }
      /* El icono SVG en línea requiere su propio tamaño nativo */
      .icon-leaf {
        width: 20px;
        height: 20px;
        fill: currentColor;
      }
      footer {
        text-align: center;
        padding: 1rem;
        background-color: var(--text-dark);
        color: var(--text-light);
        font-size: 0.9rem;
      }
    </style>
  </head>
  <body>
    <main class="hero-gigante">
      <img
        src="https://images.unsplash.com/photo-1542601906990-b4d3fb778b09?q=80&w=1200&auto=format&fit=crop"
        alt="Paisaje de bosque verde"
        class="hero-bg"
        loading="lazy"
        decoding="async"
      />
      <h1>Salvemos el Planeta</h1>
      <p>Únete a la revolución verde de GreenTech.</p>
      <button class="btn-eco">
        <svg
          class="icon-leaf"
          viewBox="0 0 448 512"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path
            d="M319.4 320.6L224 416l-95.4-95.4C57.1 249.1 57.1 133.7 128.6 62.2l4.2-4.2C167.3 23.5 214.6 0 264.4 0h119.6C401.6 0 416 14.4 416 32v119.6c0 49.8-23.5 97.1-58 131.6l-4.2 4.2c-10.4 10.4-22 19.3-34.4 26.8zM192 384l64-64V128H192v256z"
          />
        </svg>
        Quiero Ayudar
      </button>
    </main>
    <footer>
      GreenTech Solutions &copy; 2026 - Haciendo un mundo mejor (y respetando tu
      CPU al 100%)
    </footer>
  </body>
</html>
